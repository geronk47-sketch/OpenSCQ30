
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64-v8a]

    steps:
      - name: Check out OpenSCQ30 source
        uses: actions/checkout@v4
        with:
          repository: Oppzippy/OpenSCQ30
          ref: v2.13.0
          persist-credentials: false

      - name: Install Android build tools
        uses: ./.github/actions/install-android-build-tools
        with:
          cache: false
          arch: ${{ matrix.arch }}

      - name: Install just
        run: sudo snap install just --classic

      - name: Build Android APK
        run: just build-android-${{ matrix.arch }}

      - name: Sign APK
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass openscq30pass \
            -keypass openscq30pass \
            -alias openscq30 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=OpenSCQ30"

          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)

          "$APK_SIGNER" sign \
            --ks release.keystore \
            --ks-pass pass:openscq30pass \
            --key-pass pass:openscq30pass \
            --out build-output/openscq30-android-arm64-v8a.apk \
            build-output/openscq30-android-arm64-v8a-unsigned.apk

          "$APK_SIGNER" verify build-output/openscq30-android-arm64-v8a.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openscq30-android-${{ matrix.arch }}-signed
          path: build-output/openscq30-android-${{ matrix.arch }}.apk
          if-no-files-found: error
          retention-days: 14
