
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out OpenSCQ30 source
        uses: actions/checkout@v4
        with:
          repository: Oppzippy/OpenSCQ30
          ref: v2.13.0
          path: source
          persist-credentials: false

      - name: Install Android build tools
        uses: ./source/.github/actions/install-android-build-tools
        with:
          cache: false
          arch: arm64-v8a

      - name: Install just
        run: sudo snap install just --classic

      - name: Build Android APK
        working-directory: source
        run: just build-android-arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openscq30-android-arm64-v8a
          path: source/build-output/*
          if-no-files-found: error
          retention-days: 14
